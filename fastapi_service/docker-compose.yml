version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hiresignal-postgres
    restart: always
    environment:
      POSTGRES_USER: hiresignal_user
      POSTGRES_PASSWORD: hiresignal_secure_pass
      POSTGRES_DB: hiresignal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql

  api:
    build: .
    container_name: hiresignal-fastapi
    restart: always
    environment:
      DATABASE_URL: postgresql://hiresignal_user:hiresignal_secure_pass@db:5432/hiresignal_db
      RATE_LIMIT: "60/minute"
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
